<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>GUNROCK BATTLEGROUND</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071018;color:#fff;font-family:Arial,sans-serif}
button{border:0;cursor:pointer;font-weight:900}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block}

#rotate{position:fixed;inset:0;background:#000;z-index:9999;display:none;align-items:center;
justify-content:center;flex-direction:column;text-align:center}
@media(max-width:700px) and (orientation:portrait){#rotate{display:flex}.screen{display:none!important}}

#boot{background:radial-gradient(circle,#405667,#070a0d 65%)}
.center{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}
.logo{font-size:clamp(45px,10vw,100px);font-weight:1000;letter-spacing:5px}
.sub{letter-spacing:7px;opacity:.7}
.load{position:absolute;left:8%;right:8%;bottom:8%}
.bar{height:8px;background:#222;border-radius:20px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#f5b400}

.panel{width:min(480px,90vw);padding:25px;background:#0b1118f2;
border:1px solid #ffffff20;border-radius:18px;box-shadow:0 20px 70px #000}
.btn{background:#f5b400;color:#111;padding:13px 20px;border-radius:10px;margin:5px}
.btn.dark{background:#17222d;color:#fff;border:1px solid #ffffff20}
input,select{width:100%;padding:13px;background:#111b24;color:#fff;border:1px solid #465564;border-radius:10px;margin:8px 0}

#lobby{background:radial-gradient(circle at 60% 25%,#425967,#070b0e 70%)}
.top{position:absolute;top:18px;left:18px;display:flex;gap:12px;align-items:center}
.avatar{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#f5b400,#e34b00);border:3px solid white}
.stats{font-size:12px;opacity:.8}
.showcase{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);text-align:center}
.gun{font-size:100px}
.mode{position:absolute;right:20px;bottom:25px;width:270px}
.nav{position:absolute;left:18px;bottom:20px}

#game{
background:
linear-gradient(#75b6db 0 37%,#6d9655 37% 100%);
overflow:hidden
}
.world{position:absolute;inset:0;
background:
linear-gradient(90deg,#0001 1px,transparent 1px),
linear-gradient(#0001 1px,transparent 1px);
background-size:80px 80px;
transform:perspective(500px) rotateX(45deg) scale(1.5);
transform-origin:center bottom;
opacity:.4
}
.road{position:absolute;background:#303438}
.r1{width:18%;height:100%;left:41%;top:0}
.r2{height:16%;width:100%;top:44%;left:0}
.house{position:absolute;width:90px;height:65px;background:#795f4c;border:4px solid #473b35;
box-shadow:0 12px 20px #0007;transform:skewY(-4deg)}
.house:before{content:"";position:absolute;left:-7px;top:-22px;border-left:48px solid transparent;
border-right:48px solid transparent;border-bottom:25px solid #3e2520}
.h1{left:12%;top:25%}.h2{right:13%;top:25%}.h3{left:18%;bottom:15%}.h4{right:20%;bottom:13%}

#player{
position:absolute;width:30px;height:45px;background:linear-gradient(#ddd 0 30%,#29496a 31% 72%,#151a20 73%);
border:2px solid #fff;border-radius:12px;z-index:10;
transform:translate(-50%,-50%)
}
#player:before{content:"";position:absolute;width:14px;height:14px;border-radius:50%;
background:#c88e6d;left:6

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080b10">
<title>GUNROCK BATTLEGROUND</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b10;color:#fff;font-family:Arial,sans-serif}
button,input{font:inherit}button{border:0;border-radius:12px;padding:12px 16px;background:#1c2633;color:#fff;font-weight:700}
button:active{transform:scale(.97)}input{width:100%;padding:13px;border:1px solid #334252;border-radius:10px;background:#0e151d;color:#fff;outline:0}
.screen{position:absolute;inset:0;display:none;place-items:center;padding:20px}.screen.on{display:grid}
.card{width:min(560px,94vw);padding:22px;border:1px solid #293746;border-radius:18px;background:#101720;box-shadow:0 15px 50px #0008}
h1{margin:0 0 8px;font-size:clamp(28px,6vw,48px)}h2{margin:0 0 14px}.muted{color:#9eacba}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
#lobby .card{max-width:700px}.mode{padding:16px;border:1px solid #2b3948;border-radius:14px;margin:10px 0;cursor:pointer}.mode.sel{border-color:#4dd0ff;background:#102331}
#game{position:fixed;inset:0;background:#17251b;display:none}.world{position:absolute;inset:0;overflow:hidden}
#map{position:absolute;inset:-10%;background:
radial-gradient(circle at 20% 25%,#294a2b 0 10%,transparent 11%),
radial-gradient(circle at 75% 35%,#315332 0 12%,transparent 13%),
radial-gradient(circle at 45% 75%,#29482b 0 16%,transparent 17%),
linear-gradient(135deg,#18291b,#254128 45%,#1a301f);transition:transform .08s linear}
.tree{position:absolute;width:70px;height:70px;border-radius:50%;background:#122318;box-shadow:0 0 0 12px #1d3822}
.actor{position:absolute;width:30px;height:30px;border-radius:50%;transform:translate(-50%,-50%);z-index:5}
.player{background:#39d7ff;border:3px solid #dffaff;box-shadow:0 0 18px #39d7ff}.enemy{background:#ff4c52;border:2px solid #ffd0d0}
#aim{position:absolute;width:12px;height:12px;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);z-index:8;pointer-events:none}
.hud{position:absolute;z-index:20;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.pill{background:#071018d9;border:1px solid #ffffff24;padding:8px 10px;border-radius:10px;font-size:13px}.hud .right{display:flex;gap:7px}
#zone{position:absolute;border:3px solid #66e3ff88;border-radius:50%;background:#50dfff08;pointer-events:none;z-index:2}
#joy{position:absolute;left:25px;bottom:25px;width:125px;height:125px;border:2px solid #ffffff44;border-radius:50%;background:#0004;z-index:30}
#knob{position:absolute;width:54px;height:54px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:#ffffff55}
#fire{position:absolute;right:28px;bottom:35px;width:82px;height:82px;border-radius:50%;background:#ff4b4bcc;border:3px solid #fff8;z-index:30}
#reload{position:absolute;right:125px;bottom:42px;width:58px;height:58px;border-radius:50%;z-index:30}
#cmdBtn{position:absolute;right:15px;top:65px;z-index:31}
#cmdBox{position:absolute;inset:auto 12px 105px 12px;display:none;z-index:50;background:#080d13ed;border:1px solid #344554;border-radius:14px;padding:10px}
#cmdBox.on{display:block}.cmdrow{display:flex;gap:7px}.cmdrow input{flex:1}
#toast{position:absolute;left:50%;top:20%;transform:translateX(-50%);z-index:80;background:#05080dcc;padding:10px 15px;border-radius:10px;display:none}
#result .card{text-align:center}.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}.stat div{padding:12px;background:#17212c;border-radius:10px}
@media(orientation:portrait){#rotate{display:grid!important}#game>*{display:none!important}}
#rotate{display:none;position:fixed;inset:0;z-index:999;background:#070a0f;place-items:center;text-align:center;padding:30px}
</style>
</head>
<body>
<div id="rotate"><div><h2>Landscape Mode</h2><p class="muted">Phone ko horizontal/landscape position me rotate karein.</p></div></div>

<section id="boot" class="screen on"><div class="card">
<h1>GUNROCK</h1><p class="muted">BATTLEGROUND</p>
<button id="bootBtn">ENTER</button>
</div></section>

<section id="login" class="screen"><div class="card">
<h2>Player Setup</h2><input id="name" maxlength="18" placeholder="Player name">
<br><br><button id="loginBtn">CONTINUE</button>
</div></section>

<section id="lobby" class="screen"><div class="card">
<h1>GUNROCK</h1><p>Welcome, <b id="who"></b></p>
<div id="br" class="mode sel"><b>BATTLE ROYALE — 60</b><br><span class="muted">1 player + 59 AI</span></div>
<div id="svs" class="mode"><b>SQUAD VS SQUAD — 4v4</b><br><span class="muted">4 players/squad simulation</span></div>
<div class="row"><button id="startBtn">START MATCH</button><button id="profileBtn">PROFILE</button><button id="settingsBtn">SETTINGS</button></div>
<p id="profile" class="muted"></p>
</div></section>

<section id="game">
<div class="world"><div id="map"></div><div id="zone"></div><div id="aim"></div></div>
<div class="hud"><div class="pill">HP <b id="hp">100</b> · KILLS <b id="kills">0</b></div><div class="right"><div class="pill"><b id="modeTxt">BR60</b></div><div class="pill">AMMO <b id="ammo">30</b>/<b id="reserve">120</b></div></div></div>
<button id="cmdBtn">CMD</button>
<div id="joy"><div id="knob"></div></div><button id="fire">FIRE</button><button id="reload">↻</button>
<div id="cmdBox"><div class="cmdrow"><input id="cmd" autocomplete="off" placeholder="/help"><button id="send">SEND</button></div></div>
<div id="toast"></div>
</section>

<section id="result" class="screen"><div class="card">
<h2 id="resultTitle">MATCH OVER</h2><p id="resultText"></p>
<div class="stat"><div>KILLS<br><b id="rk">0</b></div><div>REWARD<br><b id="reward">0</b></div></div>
<button id="lobbyBtn">RETURN TO LOBBY</button>
</div></section>

<script>
"use strict";
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>Math.random()*(b-a)+a;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const saveKey="gunrock_save_v3";
let save={name:"Guest",matches:0,kills:0,xp:0};
try{save={...save,...JSON.parse(localStorage.getItem(saveKey)||"{}")}}catch(e){}
const G={
  mode:"BR",running:false,paused:false,raf:0,last:0,shotAt:0,reloading:false,reloadTimer:0,
  x:50,y:50,hp:100,kills:0,ammo:30,reserve:120,
  zone:{x:50,y:50,r:42,target:42,t:0},enemies:[],joy:{x:0,y:0},keys:{}
};
function persist(){try{localStorage.setItem(saveKey,JSON.stringify(save))}catch(e){}}
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("on"));$(id).classList.add("on")}
function toast(t){
  const e=$("toast");e.textContent=t;e.style.display=t?"block":"none";
  if(t){clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",1500)}
}
function lobby(){
  $("who").textContent=save.name;
  $("profile").textContent=`Matches: ${save.matches} · Total Kills: ${save.kills} · XP: ${save.xp}`;
  show("lobby");
}
$("bootBtn").onclick=()=>show(save.name==="Guest"?"login":"lobby");
$("loginBtn").onclick=()=>{
  const n=$("name").value.trim();
  if(n){save.name=n;persist();lobby()}
};
$("name").addEventListener("keydown",e=>{if(e.key==="Enter")$("loginBtn").click()});
$("br").onclick=()=>selectMode("BR");
$("svs").onclick=()=>selectMode("SVS");
function selectMode(m){G.mode=m;$("br").classList.toggle("sel",m==="BR");$("svs").classList.toggle("sel",m==="SVS")}
$("profileBtn").onclick=()=>toast(`XP ${save.xp} · Matches ${save.matches} · Kills ${save.kills}`);
$("settingsBtn").onclick=()=>toast("Landscape controls active");
$("startBtn").onclick=start;
$("lobbyBtn").onclick=()=>{stop();lobby()};

function start(){
  stop();
  G.running=true;G.paused=false;G.x=50;G.y=50;G.hp=100;G.kills=0;G.ammo=30;G.reserve=120;
  G.reloading=false;G.shotAt=0;G.enemies=[];
  G.zone={x:50,y:50,r:42,target:42,t:0};
  const total=G.mode==="BR"?59:7;
  for(let i=0;i<total;i++){
    let x,y;
    do{x=rand(8,92);y=rand(8,92)}while(Math.hypot(x-50,y-50)<12);
    G.enemies.push({x,y,hp:100,speed:rand(.8,1.7),cool:rand(.3,1.4),alive:true});
  }
  $("modeTxt").textContent=G.mode==="BR"?"BR60":"SVS4v4";
  show("game");updateUI();G.last=performance.now();G.raf=requestAnimationFrame(loop);
}
function stop(){
  G.running=false;G.paused=false;cancelAnimationFrame(G.raf);clearTimeout(G.reloadTimer);G.reloading=false;
}
function loop(t){
  if(!G.running)return;
  const dt=Math.min(.04,(t-G.last)/1000);G.last=t;
  if(!G.paused)update(dt);
  G.raf=requestAnimationFrame(loop);
}
function update(dt){
  let ax=G.joy.x,ay=G.joy.y;
  if(G.keys.w||G.keys.arrowup)ay-=1;if(G.keys.s||G.keys.arrowdown)ay+=1;
  if(G.keys.a||G.keys.arrowleft)ax-=1;if(G.keys.d||G.keys.arrowright)ax+=1;
  const l=Math.hypot(ax,ay)||1;
  G.x=clamp(G.x+ax/l*22*dt,2,98);G.y=clamp(G.y+ay/l*22*dt,2,98);

  G.zone.t+=dt;
  if(G.zone.t>25&&G.zone.r>15){G.zone.t=0;G.zone.target=Math.max(15,G.zone.r-7)}
  G.zone.r+=(G.zone.target-G.zone.r)*dt*.15;
  if(Math.hypot(G.x-G.zone.x,G.y-G.zone.y)>G.zone.r)damage(8*dt);

  for(const e of G.enemies)if(e.alive){
    const d=dist(G,e);
    if(d<34){e.x+=(G.x-e.x)/Math.max(d,.01)*e.speed*dt;e.y+=(G.y-e.y)/Math.max(d,.01)*e.speed*dt}
    e.cool-=dt;
    if(d<18&&e.cool<=0){damage(rand(4,9));e.cool=rand(.7,1.5)}
  }
  render();updateUI();
  if(G.hp<=0)finish(false);
  else if(G.enemies.every(e=>!e.alive))finish(true);
}
function damage(n){if(G.running&&!G.paused)G.hp=clamp(G.hp-n,0,100)}
function render(){
  const map=$("map"),zone=$("zone");
  map.style.transform=`translate(${-G.x*0.02}%,${-G.y*0.02}%)`;
  zone.style.left=G.zone.x+"%";zone.style.top=G.zone.y+"%";zone.style.width=G.zone.r*2+"%";zone.style.height=G.zone.r*2+"%";zone.style.transform="translate(-50%,-50%)";
  const old=[...map.querySelectorAll(".actor,.tree")];old.forEach(x=>x.remove());
  for(const e of G.enemies)if(e.alive){const d=document.createElement("div");d.className="actor enemy";d.style.left=e.x+"%";d.style.top=e.y+"%";map.appendChild(d)}
  const p=document.createElement("div");p.className="actor player";p.style.left=G.x+"%";p.style.top=G.y+"%";map.appendChild(p);
}
function updateUI(){$("hp").textContent=Math.ceil(G.hp);$("kills").textContent=G.kills;$("ammo").textContent=G.ammo;$("reserve").textContent=G.reserve}

function fire(){
  if(!G.running||G.paused||G.reloading)return;
  const now=performance.now();if(now-G.shotAt<150)return;
  G.shotAt=now;
  if(G.ammo<=0){reload();return}
  G.ammo--;
  let best=null,bd=999;
  for(const e of G.enemies)if(e.alive){const d=dist(G,e);if(d<bd&&d<24){bd=d;best=e}}
  if(best){
    best.hp-=34;
    if(best.hp<=0){best.alive=false;G.kills++;save.kills++;save.xp+=10;persist();toast("Enemy eliminated")}
  }
  updateUI();render();
}
function reload(){
  if(!G.running||G.reloading||G.ammo>=30||G.reserve<=0)return;
  G.reloading=true;toast("Reloading...");
  G.reloadTimer=setTimeout(()=>{
    const n=Math.min(30-G.ammo,G.reserve);G.ammo+=n;G.reserve-=n;G.reloading=false;updateUI()
  },900);
}
$("fire").onpointerdown=e=>{e.preventDefault();fire()};
$("reload").onpointerdown=e=>{e.preventDefault();reload()};

let joyId=null;
$("joy").onpointerdown=e=>{joyId=e.pointerId;$("joy").setPointerCapture(joyId);joyMove(e)};
$("joy").onpointermove=e=>{if(e.pointerId===joyId)joyMove(e)};
$("joy").onpointerup=joyEnd;$("joy").onpointercancel=joyEnd;
function joyMove(e){
  const r=$("joy").getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  let x=e.clientX-cx,y=e.clientY-cy,m=r.width*.38,l=Math.hypot(x,y)||1;
  if(l>m){x=x/l*m;y=y/l*m}G.joy={x:x/m,y:y/m};
  $("knob").style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px))`;
}
function joyEnd(){joyId=null;G.joy={x:0,y:0};$("knob").style.transform="translate(-50%,-50%)"}

window.addEventListener("keydown",e=>{
  G.keys[e.key.toLowerCase()]=true;
  if(e.key===" "){e.preventDefault();fire()}
  if(e.key.toLowerCase()==="r")reload();
  if(e.key==="Escape")togglePause();
});
window.addEventListener("keyup",e=>G.keys[e.key.toLowerCase()]=false);
document.addEventListener("visibilitychange",()=>{if(document.hidden&&G.running)G.paused=true});
window.addEventListener("blur",()=>{if(G.running)G.paused=true});

function togglePause(){if(!G.running)return;G.paused=!G.paused;toast(G.paused?"PAUSED":"RESUMED")}
$("cmdBtn").onclick=()=>{$("cmdBox").classList.toggle("on");$("cmd").focus()};
$("send").onclick=command;
$("cmd").addEventListener("keydown",e=>{if(e.key==="Enter")command()});
function command(){
  const raw=$("cmd").value.trim();$("cmd").value="";
  if(!raw)return;
  const c=raw.toLowerCase();
  if(c==="/help"){toast("/status /weapon /inventory /map /zone /heal /reload /pause /resume /clear");return}
  if(c==="/status"){toast(`HP ${Math.ceil(G.hp)} · Kills ${G.kills} · Alive ${G.enemies.filter(e=>e.alive).length+1}`);return}
  if(c==="/weapon"){toast("GUNROCK Rifle · Damage 34 · Mag 30");return}
  if(c==="/inventory"){toast(`Ammo ${G.ammo}/${G.reserve}`);return}
  if(c==="/map"){toast(`Position ${G.x.toFixed(0)},${G.y.toFixed(0)}`);return}
  if(c==="/zone"){toast(`Zone ${G.zone.r.toFixed(0)}%`);return}
  if(c==="/heal"){G.hp=100;updateUI();toast("HP restored");return}
  if(c==="/reload"){reload();return}
  if(c==="/pause"){G.paused=true;toast("PAUSED");return}
  if(c==="/resume"){G.paused=false;toast("RESUMED");return}
  if(c==="/clear"){$("cmdBox").classList.remove("on");return}
  toast("Unknown command · /help");
}
function finish(win){
  if(!G.running)return;
  stop();save.matches++;save.xp+=win?100:20;persist();
  $("resultTitle").textContent=win?"VICTORY":"DEFEATED";
  $("resultText").textContent=win?"All opponents eliminated.":"Your player was eliminated.";
  $("rk").textContent=G.kills;$("reward").textContent=win?100:20;
  show("result");
}
selectMode("BR");
</script>
</body>
  </html>
